name: Daily USD/UZS rate report

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC = 09:00 Asia/Tashkent
  workflow_dispatch: {}    # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest rate, build chart, send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/usd_tracker.py daily

      - name: Commit updated data and chart
        run: |
          git config user.name "USD Rate Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/usd_rates.csv charts/usd_last_year.png
          git diff --cached --quiet || git commit -m "Daily update: $(date -u +%F)"
          git push
